   <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio Link</title>
    <!-- Font chữ Inter hiện đại -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Thư viện Icon Font Awesome đầy đủ -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khung chứa hiệu ứng hạt bụi nền -->
    <div id="particles-js"></div>

    <div class="container">
        <!-- Ảnh đại diện và Thông tin cá nhân -->
        <div class="profile">
            <img src="https://cdn.upanhlaylink.com/i/YsKfycet.png" alt="Avatar" class="avatar">
            <h1>Ngọc Bổng Gaming</h1>
            <p class="bio">Roblox | Liên Quân | Fire Fire</p>
        </div>

                <!-- Danh sách các liên kết (Bio Links) -->
        <div class="links">
            
            <!-- Mục GitHub -->
            <a href="https://ipas.cc/e157z0" target="_blank" class="link-card">
                <!-- Ảnh icon nhỏ gọn bo tròn nằm phía trước -->
                <img src="https://i.postimg.cc/wMkzwh26/IMG-4719.jpg" alt="GitHub Icon" class="link-icon"> 
                
                <!-- Khung chứa nội dung chữ nằm bên phải -->
                <div class="link-content">
                    <div class="link-main">
                        <span>Delta X QT IOS</span>
                        <span class="badge-pulse">NEW</span>
                    </div>
                    <span class="update-date"> Link Cài Trực Tiếp V2.735 Cập nhật: 20/08/2026</span>
                </div>
            </a>

            <!-- Mục LinkedIn -->
            <a href="https://linkedin.com" target="_blank" class="link-card">
                <img src="https://flaticon.com" alt="LinkedIn Icon" class="link-icon"> 
                <div class="link-content">
                    <div class="link-main">
                        <span>LinkedIn Profile</span>
                    </div>
                    <span class="update-date" data-auto-date="true">Đang tải ngày...</span>
                </div>
            </a>

            <!-- Mục Facebook -->
            <a href="https://facebook.com" target="_blank" class="link-card">
                <img src="https://flaticon.com" alt="Facebook Icon" class="link-icon"> 
                <div class="link-content">
                    <div class="link-main">
                        <span>Facebook Cá Nhân</span>
                    </div>
                    <span class="update-date">Cập nhật: 20/08/2026</span>
                </div>
            </a>

        </div>


        <!-- Chân trang -->
        <div class="footer">
            <p>© 2026 Crafted by Me</p>
        </div>
    </div>

    <!-- Thư viện hiệu ứng và logic điều khiển -->
    <script src="https://jsdelivr.net"></script>
    <script src="app.js"></script>
</body>
</html>
