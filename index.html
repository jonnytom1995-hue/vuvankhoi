<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Downloader</title>
    <style>
        :root {
            --primary: #00b4d8;
            --dark: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--card);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .app-icon {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 16px rgba(0,180,216,0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .version {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            background: rgba(255,255,255,0.05);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .btn {
            display: block;
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0,180,216,0.2);
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .info-list {
            margin-top: 24px;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 500; }
        .loading {
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Icon ứng dụng (Thay bằng ảnh của bạn nếu muốn) -->
    <div class="app-icon">🤖</div>
    
    <!-- Tên ứng dụng -->
    <h1 id="app-name">Đang tải...</h1>
    
    <!-- Phiên bản -->
    <div class="version" id="app-version">Phiên bản: --</div>

    <!-- Nút Download -->
    <button class="btn" id="download-btn" disabled>Đang kiểm tra file...</button>

    <!-- Thông tin chi tiết file -->
    <div class="info-list">
        <div class="info-item">
            <span class="info-label">Dung lượng:</span>
            <span class="info-value" id="file-size">-- MB</span>
        </div>
        <div class="info-item">
            <span class="info-label">Lượt tải về:</span>
            <span class="info-value" id="download-count">--</span>
        </div>
        <div class="info-item">
            <span class="info-label">Cập nhật:</span>
            <span class="info-value" id="update-date">--</span>
        </div>
    </div>
</div>

<script>
    // === CẤU HÌNH GITHUB CỦA BẠN TẠI ĐÂY ===
    const GITHUB_USER = 'ten-user-github'; // Thay bằng username GitHub của bạn
    const GITHUB_REPO = 'ten-kho-luu-tru'; // Thay bằng tên Repository chứa file APK
    const APP_DISPLAY_NAME = 'Ứng Dụng Của Tôi'; // Tên ứng dụng hiển thị trên web

    // Link API của GitHub để lấy bản Release mới nhất
    const API_URL = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/releases/latest`;

    // Định dạng dung lượng file từ Byte sang MB
    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // Định dạng ngày tháng năm
    function formatDate(dateString) {
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        return new Date(dateString).toLocaleDateString('vi-VN', options);
    }

    async function fetchAPKDetails() {
        const nameElem = document.getElementById('app-name');
        const versionElem = document.getElementById('app-version');
        const btnElem = document.getElementById('download-btn');
        const sizeElem = document.getElementById('file-size');
        const countElem = document.getElementById('download-count');
        const dateElem = document.getElementById('update-date');

        nameElem.innerText = APP_DISPLAY_NAME;

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Không thể kết nối đến GitHub API');
            
            const data = await response.json();
            
            // Tìm file có đuôi .apk trong danh sách Assets của Release
            const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));

            if (apkAsset) {
                // Hiển thị thông tin lên giao diện
                versionElem.innerText = `Phiên bản: ${data.tag_name}`;
                sizeElem.innerText = formatBytes(apkAsset.size);
                countElem.innerText = apkAsset.download_count.toLocaleString('vi-VN');
                dateElem.innerText = formatDate(apkAsset.updated_at);

                // Cấu hình nút bấm download chuyển hướng thẳng tới link file
                btnElem.innerText = 'Tải Về APK Ngay';
                btnElem.disabled = false;
                btnElem.onclick = () => {
                    window.location.href = apkAsset.browser_download_url;
                };
            } else {
                btnElem.innerText = 'Không tìm thấy file APK';
                versionElem.innerText = 'Lỗi phát hành';
            }

        } catch (error) {
            console.error(error);
            btnElem.innerText = 'Lỗi tải dữ liệu';
            nameElem.innerText = 'Lỗi kết nối';
        }
    }

    // Chạy hàm lấy dữ liệu khi trang web tải xong
    window.onload = fetchAPKDetails;
</script>

</body>
</html>
